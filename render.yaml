services:
  - type: web
    name: daily-fortune
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SITE_URL
        value: https://fortunedaily.co.kr
      - key: PUBLIC_NAVER_SITE_VERIFICATION
        value: 905c23e2fa9cd67332bad768543c90b61cb93cd2
      - key: PUBLIC_ADFIT_ENABLED
        value: "false"
      - key: PUBLIC_ADFIT_ALLOWED_HOSTS
        value: fortunedaily.co.kr,www.fortunedaily.co.kr
      - key: PUBLIC_ADFIT_HOME_AFTER_SUMMARY_M_320X100
        sync: false
      - key: PUBLIC_ADFIT_HOME_AFTER_SUMMARY_D_728X90
        sync: false
      - key: PUBLIC_ADFIT_HOME_BETWEEN_DIRECTORIES_M_300X250
        sync: false
      - key: PUBLIC_ADFIT_HOME_BETWEEN_DIRECTORIES_D_728X90
        sync: false
      - key: PUBLIC_ADFIT_TODAY_AFTER_SUMMARY_M_320X100
        sync: false
      - key: PUBLIC_ADFIT_TODAY_AFTER_SUMMARY_D_728X90
        sync: false
      - key: PUBLIC_ADFIT_WEEKLY_AFTER_SUMMARY_M_320X100
        sync: false
      - key: PUBLIC_ADFIT_WEEKLY_AFTER_SUMMARY_D_728X90
        sync: false
      - key: PUBLIC_ADFIT_MONTHLY_AFTER_SUMMARY_M_320X100
        sync: false
      - key: PUBLIC_ADFIT_MONTHLY_AFTER_SUMMARY_D_728X90
        sync: false
      - key: PUBLIC_ADFIT_PROFILE_AFTER_SUMMARY_M_320X100
        sync: false
      - key: PUBLIC_ADFIT_PROFILE_AFTER_SUMMARY_D_728X90
        sync: false
      - key: PUBLIC_ADFIT_PROFILE_MID_LIFE_M_300X250
        sync: false
      - key: PUBLIC_ADFIT_PROFILE_MID_LIFE_D_300X250
        sync: false
      - key: PUBLIC_ADFIT_DIRECTORY_MID_M_320X100
        sync: false
      - key: PUBLIC_ADFIT_DIRECTORY_MID_D_728X90
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icon-*.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
